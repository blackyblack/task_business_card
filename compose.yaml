services:
    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/bio
        depends_on:
            db:
                condition: service_healthy
        networks:
            - default
            - database

    db:
        image: postgres:17
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: bio
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d bio"]
            interval: 2s
            timeout: 5s
            retries: 15
        networks:
            - database

networks:
    default:
    database:
        internal: true

volumes:
    postgres_data:
